<mat-drawer-container>
  <mat-drawer mode="side" opened>
    <h2>Menu</h2>
    <div class="menu">
      @for (item of options; track item.name) {
        <div class="item">
          <a [routerLink]="item.path" routerLinkActive="ativo">{{ item.name }}</a>
        </div>
      }
    </div>
  </mat-drawer>

  <mat-drawer-content>
    <div style="padding: 10px">
      <ng-content></ng-content>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
