<mat-drawer-container>
  <mat-drawer mode="side" [opened]="autenticacaoService.authenticated()">
    @if (autenticacaoService.authenticated()) {
      <h2>Menu</h2>
      <div class="menu">
        @for (item of menuOptions; track item.name) {
          <div class="item">
            <a [routerLink]="item.path" routerLinkActive="ativo">{{ item.name }}</a>
          </div>
        }
        <div class="item">
          <button type="button" (click)="autenticacaoService.logout()">Sair</button>
        </div>
      </div>
    }
  </mat-drawer>

  <mat-drawer-content>
    <div [style.padding.px]="autenticacaoService.authenticated() ? 10 : 0">
      <ng-content></ng-content>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
