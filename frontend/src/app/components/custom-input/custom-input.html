<mat-form-field appearance="outline" style="width: 100%">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [value]="displayValue()"
    [type]="type()"
    [attr.minlength]="mask() ? null : minLength()"
    [attr.maxlength]="maxInputLength()"
    [formControl]="control()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  @if (form().get(name())?.errors) {
    <mat-error>{{ message() }}</mat-error>
  }
</mat-form-field>
