<main class="auth-page">
  <section class="auth-card">
    <h1>Criar conta</h1>
    <p>Preencha seus dados para se cadastrar.</p>

    <form class="form">
      <app-custom-input [form]="form" name="nome" label="Nome" />
      <app-custom-input [form]="form" name="cpf" label="CPF (11 dígitos)" [mask]="cpfMask" />
      <app-custom-input [form]="form" name="email" label="E-mail" type="email" />
      <app-custom-input
        [form]="form"
        name="telefone"
        label="Telefone (DDD + número)"
        [mask]="phoneMask"
      />
      <app-endereco-form [form]="enderecoForm" />
      <app-custom-input [form]="form" name="senha" label="Senha" type="password" />
    </form>
    <div class="button-group_modal">
      <app-custom-button
        style="width: 100%"
        [disabled]="isSubmitting"
        [title]="isSubmitting ? 'Criando conta...' : 'Criar conta'"
        [onClick]="cadastrar"
      />
    </div>
    <p class="auth-link">Já tem uma conta? <a routerLink="/login">Entrar</a></p>
  </section>
</main>
